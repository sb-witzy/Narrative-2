name: Build macOS installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to embed in the installer (e.g. 1.1.0)"
        required: true
        default: "0.0.0-dev"

jobs:
  build-installer-mac:
    runs-on: macos-14   # Apple Silicon runner
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF##*/v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Build frontend
        working-directory: frontend
        run: |
          echo "REACT_APP_BACKEND_URL=" > .env.production
          yarn install --frozen-lockfile
          yarn build

      - name: Build .pkg
        run: |
          chmod +x installer/mac/build-pkg.sh
          installer/mac/build-pkg.sh "${{ steps.version.outputs.version }}"
          ls -lh installer/dist/

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NarrativeRx-Setup-mac-${{ steps.version.outputs.version }}
          path: installer/dist/*.pkg
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/*.pkg
          generate_release_notes: true
